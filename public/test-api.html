<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MongoDB API Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #0a0e1a;
      color: #e8fefe;
    }
    .status {
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .success { background: #10b981; }
    .error { background: #ef4444; }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .product-card {
      background: #1a1e2e;
      border: 1px solid #2a3550;
      border-radius: 12px;
      padding: 15px;
    }
    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }
    button {
      background: #06b6d4;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #0891b2;
    }
    .delete-btn {
      background: #ef4444;
    }
    .delete-btn:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <h1>🗄️ MongoDB API Test</h1>
  
  <div id="status"></div>
  
  <div>
    <button onclick="testHealth()">Check Server Health</button>
    <button onclick="loadProducts()">Load Products</button>
    <button onclick="createTestProduct()">Create Test Product</button>
  </div>
  
  <div id="products" class="product-grid"></div>

  <script>
    const API_URL = 'http://localhost:5000/api';

    async function testHealth() {
      const statusDiv = document.getElementById('status');
      try {
        const response = await fetch(`${API_URL}/health`);
        const data = await response.json();
        statusDiv.innerHTML = `
          <div class="status success">
            ✅ Server Status: ${data.status}<br>
            📡 Database: ${data.database}<br>
            💬 Message: ${data.message}
          </div>
        `;
      } catch (error) {
        statusDiv.innerHTML = `
          <div class="status error">
            ❌ Error: ${error.message}<br>
            Make sure the server is running on port 5000
          </div>
        `;
      }
    }

    async function loadProducts() {
      const productsDiv = document.getElementById('products');
      try {
        const response = await fetch(`${API_URL}/products`);
        const products = await response.json();
        
        if (products.length === 0) {
          productsDiv.innerHTML = '<p>No products found. Run: npm run seed</p>';
          return;
        }

        productsDiv.innerHTML = products.map(product => `
          <div class="product-card">
            <img src="${product.imageUrl}" alt="${product.name}">
            <h3>${product.name}</h3>
            <p style="color: #94a3b8; font-size: 14px;">${product.description}</p>
            <div style="display: flex; justify-between; align-items: center; margin: 10px 0;">
              <strong style="color: #06b6d4;">$${product.price}</strong>
              <span style="color: #fbbf24;">⭐ ${product.rating}</span>
            </div>
            <div style="font-size: 12px; color: #64748b;">
              Category: ${product.category} | Stock: ${product.stock}
            </div>
            <button class="delete-btn" onclick="deleteProduct('${product._id}')">Delete</button>
          </div>
        `).join('');

        document.getElementById('status').innerHTML = `
          <div class="status success">
            ✅ Loaded ${products.length} products from MongoDB
          </div>
        `;
      } catch (error) {
        document.getElementById('status').innerHTML = `
          <div class="status error">
            ❌ Error loading products: ${error.message}
          </div>
        `;
      }
    }

    async function createTestProduct() {
      try {
        const response = await fetch(`${API_URL}/products`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            name: 'Test Product ' + Date.now(),
            price: Math.round(Math.random() * 200 + 50),
            description: 'This product was created from the test page',
            imageUrl: 'https://picsum.photos/seed/' + Date.now() + '/800/800',
            rating: Math.round(Math.random() * 50) / 10,
            reviewCount: Math.round(Math.random() * 100),
            category: 'Test',
            stock: Math.round(Math.random() * 50)
          })
        });
        
        const product = await response.json();
        document.getElementById('status').innerHTML = `
          <div class="status success">
            ✅ Created product: ${product.name}
          </div>
        `;
        loadProducts();
      } catch (error) {
        document.getElementById('status').innerHTML = `
          <div class="status error">
            ❌ Error creating product: ${error.message}
          </div>
        `;
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Delete this product?')) return;
      
      try {
        await fetch(`${API_URL}/products/${id}`, {
          method: 'DELETE'
        });
        document.getElementById('status').innerHTML = `
          <div class="status success">
            ✅ Product deleted successfully
          </div>
        `;
        loadProducts();
      } catch (error) {
        document.getElementById('status').innerHTML = `
          <div class="status error">
            ❌ Error deleting product: ${error.message}
          </div>
        `;
      }
    }

    // Auto-load on page load
    window.onload = () => {
      testHealth();
      loadProducts();
    };
  </script>
</body>
</html>
